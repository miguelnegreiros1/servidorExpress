<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Avian World - Bird Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header Section -->
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-icon">🦩</span>
        <h1>Avian World</h1>
      </div>
      <p class="subtitle">Click on any bird to view details and location occurrence.</p>

      <!-- Search & Filter Controls -->
      <div class="controls">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search by species or region..." />
        </div>
      </div>
    </div>
  </header>

  <!-- Main Grid Section -->
  <main class="main-container">
    <div id="birdGrid" class="bird-grid"></div>
    <div id="noResults" class="no-results hidden">
      <span>🔍</span>
      <p>No birds found matching your search.</p>
    </div>
  </main>

  <!-- Modal / Detail Panel -->
  <div id="modalOverlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button id="closeModalBtn" class="close-btn" aria-label="Close panel">&times;</button>
      
      <div class="modal-body">
        <div class="modal-image-wrapper">
          <img id="modalBirdImage" src="" alt="" />
          <span id="modalRegionBadge" class="badge"></span>
        </div>
        
        <div class="modal-content">
          <h2 id="modalBirdName"></h2>
          <p id="modalScientificName" class="scientific-name"></p>
          
          <div class="info-group">
            <h3>📍 Occurrence & Location</h3>
            <p id="modalOccurrence"></p>
          </div>
          
          <div class="info-group">
            <h3>🌿 Habitat & Features</h3>
            <p id="modalDescription"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
